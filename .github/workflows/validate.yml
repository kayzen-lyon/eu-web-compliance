name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Chaque lundi : signale les sources consultées il y a plus de 90 jours
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests du script de contrôle
        run: python -m unittest discover -s tests -v
      - name: Contrôle de structure
        run: python scripts/validate.py --require-skill
      - name: Textes officiels du RGAA identiques à la source
        run: python scripts/rgaa_official.py
      - name: Matrice d'applicabilité du profil d'exemple
        run: python scripts/applicability.py templates/profile.example.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Outils de vérification d'accessibilité
        run: npm ci && npx playwright install --with-deps chromium
      - name: Vérificateurs traceurs et en-têtes
        run: node --test
      - name: Vérificateur mesuré sur les sites de test
        run: node scripts/check-examples.mjs
      - name: Fraîcheur des sources (tâche planifiée)
        if: github.event_name == 'schedule'
        run: python scripts/validate.py --strict
