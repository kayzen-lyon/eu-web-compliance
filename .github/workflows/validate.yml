name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Chaque lundi : signale les sources consultées il y a plus de 90 jours
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests du script de contrôle
        run: python -m unittest discover -s tests -v
      - name: Contrôle de structure
        run: python scripts/validate.py
      - name: Fraîcheur des sources (tâche planifiée)
        if: github.event_name == 'schedule'
        run: python scripts/validate.py --strict
