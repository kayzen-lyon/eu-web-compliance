name: validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Chaque lundi : signale les sources consultées il y a plus de 90 jours
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Tests du script de contrôle
        run: python -m unittest discover -s tests -v
      - name: Contrôle de structure
        run: python scripts/validate.py --require-skill
      - name: Textes officiels du RGAA identiques à la source
        run: python scripts/rgaa_official.py
      - name: Matrice d'applicabilité du profil d'exemple
        run: python scripts/applicability.py templates/profile.example.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Outils de vérification d'accessibilité
        run: npm ci && npx playwright install --with-deps chromium
      - name: Vérificateurs traceurs et en-têtes
        run: node --test
      - name: Vérificateur mesuré sur les sites de test
        run: node scripts/check-examples.mjs
      - name: Fraîcheur des sources (tâche planifiée)
        if: github.event_name == 'schedule'
        run: python scripts/validate.py --strict

  # L'Action publiée (action.yml) est essayée sur un site d'exemple corrigé, telle qu'un dépôt
  # l'appellerait : installation, vérificateurs, résumé, fichier joint.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Action sur un site d'exemple
        id: check
        uses: ./
        with:
          target: examples/showcase-site/fixed
          project: examples/showcase-site
          lang: fr
          fail-on-violation: "false"
          artifact-name: rapport-site-exemple
      - name: Le rapport existe et ses sorties sont renseignées
        env:
          REPORT: ${{ steps.check.outputs.report-json }}
          NON_CONFORMITIES: ${{ steps.check.outputs.non-conformities }}
        run: |
          test -f "$REPORT"
          test -n "$NON_CONFORMITIES"
