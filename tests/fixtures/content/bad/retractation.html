<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Rétractation</title>
</head>
<body>
  <main>
    <h1>Se rétracter d'un contrat</h1>
    <section data-withdrawal>
      <form>
        <label for="wd-name">Votre nom</label><input id="wd-name" autocomplete="name" required>
        <label for="wd-contract">Numéro de commande</label><input id="wd-contract" required>
        <label for="wd-email">Adresse électronique</label><input id="wd-email" type="email" required>
        <label for="wd-motif">Motif de la rétractation</label>
        <select id="wd-motif" required><option value="">Choisir</option><option>Produit abîmé</option></select>
        <button type="submit">Envoyer</button>
      </form>
    </section>
  </main>
  <footer>
    <ul>
      <li><a href="mentions.html">Mentions légales</a></li>
      <li><a href="retractation.html">Renoncer au contrat ici</a></li>
    </ul>
  </footer>
</body>
</html>
