<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accueil - fixture traceurs (propre)</title>
  <script type="text/plain" data-consent-purpose="audience" src="https://www.googletagmanager.com/gtag/js?id=G-FIXTURE"></script>
  <script src="js/consent.js" defer></script>
</head>
<body>
  <main>
    <h1>Accueil</h1>
    <p>Page de test : aucun traceur avant le consentement.</p>
  </main>
  <footer>
    <button id="consent-manage" type="button">Gérer les cookies</button>
  </footer>
  <div id="consent-banner" role="region" aria-label="Cookies" hidden>
    <p>Nous utilisons des cookies de mesure d'audience si vous l'acceptez.</p>
    <button id="consent-refuse" type="button">Tout refuser</button>
    <button id="consent-accept" type="button">Tout accepter</button>
    <button id="consent-customise" type="button">Personnaliser</button>
  </div>
</body>
</html>
